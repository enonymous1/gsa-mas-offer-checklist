name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check JavaScript syntax
        run: node --check site/app.js

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Generator reproduces shipped checklist.json
        run: |
          python3 tools/build_data.py --out /tmp/checklist.json
          diff -u site/checklist.json /tmp/checklist.json
